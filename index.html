<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f7a6c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GABドリル">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>C-GAB 解答集ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a single answer-sheet column; each 大問 is one sheet, choices are mark-sheet bubbles */
:root{
  --paper:#f6f8f7; --sheet:#ffffff; --ink:#1d2624; --muted:#5f6d69; --line:#d5dfdb;
  --omr:#0f7a6c; --omr-soft:#e2f1ee; --graphite:#2b3230;
  --ok:#14804a; --ok-soft:#e3f4ea; --ng:#c2362f; --ng-soft:#fbe9e7; --warn:#a8610a; --warn-soft:#fdf1df;
  --f-disp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121816; --sheet:#1a2220; --ink:#e4ece9; --muted:#9aaaa5; --line:#2e3b38;
  --omr:#4cc2ae; --omr-soft:#173a34; --graphite:#e4ece9;
  --ok:#52c98a; --ok-soft:#163626; --ng:#f07a72; --ng-soft:#3d1d1b; --warn:#f0b35a; --warn-soft:#3a2a12; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121816; --sheet:#1a2220; --ink:#e4ece9; --muted:#9aaaa5; --line:#2e3b38;
  --omr:#4cc2ae; --omr-soft:#173a34; --graphite:#e4ece9;
  --ok:#52c98a; --ok-soft:#163626; --ng:#f07a72; --ng-soft:#3d1d1b; --warn:#f0b35a; --warn-soft:#3a2a12; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--omr);outline-offset:2px}
h1{font-family:var(--f-disp);font-weight:900;font-size:1.7rem;line-height:1.3;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;color:var(--omr);text-transform:uppercase}
.lead{color:var(--muted);margin:.4rem 0 0}
/* home */
.sections{display:grid;gap:12px;margin-top:24px}
.sec{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:18px}
.sec:hover{border-color:var(--omr)}
.sec .glyph{width:52px;height:52px;border-radius:50%;border:2px solid var(--omr);display:grid;place-items:center;font-family:var(--f-disp);font-weight:900;font-size:1.25rem;color:var(--omr)}
.sec h2{font-family:var(--f-disp);font-size:1.2rem;margin:0;line-height:1.3}
.sec .meta{color:var(--muted);font-size:.85rem}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--omr)}
.sec .go{font-family:var(--f-mono);color:var(--omr);font-size:1.2rem}
.opts{margin-top:20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:none;padding:6px 14px;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--omr);color:var(--sheet)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.85rem;padding:4px}
.legend{margin-top:28px;font-size:.85rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:14px}
.legend b{color:var(--ink)}
/* quiz */
.top{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
.back{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.85rem;background:var(--sheet)}
.count{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.passage{padding:20px 20px 16px;border-bottom:2px solid var(--omr)}
.passage .no{font-family:var(--f-mono);font-size:.75rem;color:var(--omr);letter-spacing:.08em}
.passage .ttl{font-family:var(--f-disp);font-weight:700;font-size:1.25rem;line-height:1.5;margin:.2rem 0 0;overflow-wrap:anywhere}
.passage .alt{font-size:.82rem;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}
.item{padding:16px 20px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.qhead{display:flex;gap:10px;align-items:baseline}
.qnum{flex:none;font-family:var(--f-mono);font-size:.75rem;color:var(--sheet);background:var(--graphite);border-radius:4px;padding:1px 7px}
.qtext{font-weight:700;overflow-wrap:anywhere;min-width:0}
.qalt{font-size:.8rem;color:var(--muted);margin:2px 0 0 0;overflow-wrap:anywhere}
.choices{display:grid;gap:8px;margin-top:12px}
.choices.abc{grid-template-columns:repeat(3,1fr)}
.ch{display:flex;gap:10px;align-items:center;text-align:left;background:none;border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-width:0}
.choices.abc .ch{flex-direction:column;gap:4px;text-align:center;padding:10px 6px}
.ch:hover:not(:disabled){border-color:var(--omr);background:var(--omr-soft)}
.ch:disabled{cursor:default}
.bub{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--omr);display:grid;place-items:center;font-family:var(--f-mono);font-size:.85rem;color:var(--omr)}
.ch .lbl{overflow-wrap:anywhere;min-width:0;font-size:.92rem}
.choices.abc .ch .lbl{font-size:.78rem;color:var(--muted);line-height:1.35}
.ch.pick .bub{background:var(--graphite);border-color:var(--graphite);color:var(--sheet)}
.ch.right{border-color:var(--ok);background:var(--ok-soft)}
.ch.right .bub{border-color:var(--ok);color:var(--ok)}
.ch.right.pick .bub{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.ch.wrong{border-color:var(--ng);background:var(--ng-soft)}
.ch.wrong.pick .bub{background:var(--ng);border-color:var(--ng)}
.fb{margin-top:10px;font-size:.86rem;display:grid;gap:4px}
.fb .verdict{font-weight:700}
.fb .verdict.ok{color:var(--ok)} .fb .verdict.ng{color:var(--ng)}
.fb .ans{overflow-wrap:anywhere}
.chip{display:inline-block;font-size:.72rem;border-radius:4px;padding:0 6px;background:var(--warn-soft);color:var(--warn);font-weight:700;margin-right:6px}
.note{color:var(--muted);overflow-wrap:anywhere}
.src{display:inline-block;font-size:.72rem;border-radius:4px;padding:0 6px;margin-right:4px;border:1px solid var(--line);color:var(--muted)}
.src.gab{border-color:var(--omr);color:var(--omr);font-weight:700}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:16px}
.score{font-family:var(--f-disp);font-weight:700;font-size:1.1rem}
.score small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:.85rem;margin-left:6px}
.btn{border:1px solid var(--omr);background:var(--omr);color:var(--sheet);border-radius:999px;padding:9px 20px;font-weight:700}
.btn.ghost{background:var(--sheet);color:var(--omr)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.empty{background:var(--sheet);border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
@media (max-width:480px){.choices.abc .ch .lbl{font-size:.7rem}.passage,.item{padding-left:14px;padding-right:14px}h1{font-size:1.45rem}}
@media (prefers-reduced-motion:no-preference){.ch{transition:background .12s,border-color .12s}}
</style>
</head>

<script>
const DATA={"gen":[{"no":1,"t":"18世紀後半","items":[{"q":"（設問文なし：設問1→4の解答の並び）","a":"AACA","bd":"AACA（1）","cf":0,"m":"設問の並び順が変わる場合あり","n":null,"seq":1,"acc":["AACA"]}]},{"no":2,"t":"1970年代なかばころまでの日本社会には、","items":[{"q":"外的な規制が緩やかな社会は、自由な社会であると言える。","a":"A","bd":"A（1）","cf":0,"n":1,"acc":["A"]},{"q":"「型」とは、おもに外から見えるかたちである。","a":"A","bd":"A（1）","cf":0,"n":2,"acc":["A"]},{"q":"管理主義教育の下では、「型」を守るために、欲求の自己制御が必要になる。","a":"B","bd":"B（1）","cf":0,"n":3,"acc":["B"]},{"q":"昔ながらの「型」にあふれた社会にも、良い面はあった。","a":"C","bd":"C（1）","cf":0,"n":4,"acc":["C"]}]},{"no":3,"t":"「AならばBだ」という命題に対し、「BならばAだ」","items":[{"q":"ある命題とその対偶の真偽が一致しない場合は、対偶の取り方が間違っている。","a":"A","bd":"A（1）","cf":0,"n":1,"acc":["A"]},{"q":"「(A君は)叱られないと勉強しない」という命題の裏は「(A君は)叱られると勉強する」である。","a":"A","bd":"A（1）","cf":0,"n":2,"acc":["A"]},{"q":"時間の前後関係を含む命題の逆は、命題と真偽が一致しないことが多い。","a":"C","bd":"C（1）","cf":0,"n":3,"acc":["C"]},{"q":"ある命題とその対偶とでは、時間の前後関係がある場合にはその真偽が必ずしも一致しない。","a":"B","bd":"B（1）","cf":0,"n":4,"acc":["B"]}]},{"no":4,"t":"「Bamboo」は日本を代表するものだ。","alt":"たけだけしい ／ 竹 しいたけ","items":[{"q":"マツやアカマツは海外から日本にもたらされて植林された","a":"C","bd":"C（7）","cf":0,"m":"日本人は東南アジアからもたらされた「竹」に真っ直ぐに成長するイメージから「猛る」という意味を持たせた。 / 解答集23caca / 解答集1ccca, cbac 順番前後している可能性あり","qa":"カシカラマツは西洋から日本北部へ植林が広まった ／ マツは西洋から日本へ植林が広まった ／ 日本の北部から広まった","n":1,"acc":["C"],"g":"C"},{"q":"キノコの「タケ」は「たけだけしい」と関連している","a":"A","bd":"A（7）","cf":0,"m":"きのこが「タケ」と呼ばれるのも同様の理由で「猛る、猛々しい」から取られている松茸もマツとタケから来ている日本人は、","qa":"キノコの「タケ」は猛る、猛々しいからきている","n":2,"acc":["A"],"g":"A"},{"q":"竹は意外と地面に対して接地が脆いという側面がある","a":"C","bd":"C（7）","cf":0,"m":"北米からきた騎馬民族(マツ)、東南アジアからきた栽培民族(竹)のどちらの人間性的側面を持つのか","qa":"意外と竹の根本はもろい ／ 意外と竹の根元はもろい","n":3,"acc":["C"],"g":"C"},{"q":"日本人の人間性がたけのこの地に根をはるということと関係性がある","a":"A","bd":"A（7）","cf":0,"qa":"日本人の性質","n":4,"acc":["A"],"g":"A"},{"q":"（設問文なし：設問1→4の解答の並び）","a":"CCAA","bd":"CCAA（2）","cf":0,"m":"設問の並び順が変わる場合あり","n":null,"seq":1,"acc":["CCAA"]}]},{"no":5,"t":"OB訪問","items":[{"q":"（設問文なし：設問1→4の解答の並び）","a":"BCAC","bd":"BCAC（1）","cf":0,"m":"設問の並び順が変わる場合あり","n":null,"seq":1,"acc":["BCAC"]   return out+str.slice(last);}
function nonChoices(q){const c=cleanNum(q.a);const seen=new Set([c]);const out=[];
  if(/\d/.test(c)){const fs=shuffle([0.5,0.6,0.75,0.8,1.2,1.25,1.4,1.5,2]);const dns=shuffle([-2,-1,1,2,3]);const dys=shuffle([-5,-3,-2,2,3,5]);
    for(let i=0;i<20&&out.length<2;i++){const p=perturb(c,{f:fs[i%fs.length],dn:dns[i%dns.length],dy:dys[i%dys.length]});if(p&&!seen.has(p)){seen.add(p);out.push(p);}}}
  let tries=0;const pool=/\d/.test(c)?DATA.non.map(x=>cleanNum(x.a)):nonWordPool;
  while(out.length<2&&tries++<200){const p=pick(pool);if(!seen.has(p)){seen.add(p);out.push(p);}}
  return shuffle([{t:c,ok:true},...out.map(t=>({t}))]);}

/* ---------- home ---------- */
function home(){cur=null;app.replaceChildren();
  app.append(el('div',{class:'eyebrow'},'C-GAB 解答集 · 暗記ドリル'),el('h1',null,'分野を選んで解く'),
    el('p',{class:'lead'},'言語と英語は大問をランダムに選び、その小問をまとめて解きます。非言語は1問ずつランダムに出題します。'));
  const seg=el('div',{class:'seg',role:'group','aria-label':'出題範囲'});
  for(const [m,l] of [['all','すべて'],['seen','解いた問題'],['miss','間違えた問題']])seg.append(el('button',{'aria-pressed':String(mode===m),onclick:()=>{mode=m;home();}},l));
  const list=el('div',{class:'sections'});
  for(const sec of ['gen','non','eng']){const st=stats(sec);const n=groups(sec).length;const pct=st.tot?Math.round(st.ok/st.tot*100):0;
    list.append(el('button',{class:'sec',onclick:()=>start(sec)},el('span',{class:'glyph','aria-hidden':'true'},SEC[sec].glyph),
      el('span',null,el('h2',null,SEC[sec].name),el('span',{class:'meta'},sec==='non'?`${n}問`:`${n}大問・設問${st.tot}`,` ／ 正解済 ${st.ok}・要復習 ${st.ng}`+(st.a?`・正答率 ${Math.round(st.c/st.a*100)}%`:'')),el('div',{class:'bar'},el('i',{style:`width:${pct}%`}))),
      el('span',{class:'go','aria-hidden':'true'},'→')));}
  app.append(list,el('div',{class:'opts'},seg,el('button',{class:'link',onclick:resetConfirm},'記録をリセット')));
  app.append(el('div',{class:'legend'},el('b',null,'言語の選択肢'),'　A：本文から明らかに正しい　B：明らかに間違っている　C：本文だけでは判断できない',el('br'),
    '出題順：まだ解いていない・解いた回数が少ない問題から順に出し、回数が同じなら正答率の低い問題を先に出します。',el('br'),'出題範囲：「解いた問題」は一度でも答えを選んだ問題（正解・不正解とも）、「間違えた問題」は最後に答えたとき不正解だった問題だけから出題します。',el('br'),'英語・非言語のダミー選択肢は他の問題の解答や数値をずらしたもので、正解は「GAB解答集」の答えを優先し、GAB解答集に載っていない問題は統合版の最有力の答えにしています（非言語はGAB解答集に収録がないため最有力の答え）。'));}
let resetArmed=false;
function resetConfirm(e){const b=e.currentTarget;if(!resetArmed){resetArmed=true;b.textContent='もう一度押すとリセット';setTimeout(()=>{resetArmed=false;if(b.isConnected)b.textContent='記録をリセット';},3000);return;}S={wrong:{},done:{},cnt:{}};save();resetArmed=false;home();}

/* ---------- quiz ---------- */
function start(sec){const gs=groups(sec);let idx=gs.map((_,i)=>i);
  if(mode==='miss')idx=idx.filter(i=>keysOf(sec,gs[i]).some(k=>S.wrong[k]));
  if(mode==='seen')idx=idx.filter(i=>keysOf(sec,gs[i]).some(k=>S.done[k]||S.wrong[k]));
  cur={sec,pool:idx,shown:new Set(),current:null,total:idx.length};show();window.scrollTo(0,0);}
/* 出題順：①小問の最少解答回数が少ない大問 → ②正答率が低い大問 → ③同点はランダム。今回のセッションで出した大問は一巡するまで出さない */
function prio(sec,g){let mn=Infinity,a=0,c=0;for(const k of keysOf(sec,g)){const v=S.cnt[k]||[0,0];mn=Math.min(mn,v[0]);a+=v[0];c+=v[1];}return[mn,a?c/a:0];}
function nextGroup(){const gs=groups(cur.sec);let cand=cur.pool.filter(i=>!cur.shown.has(i));if(!cand.length){cur.shown.clear();cand=cur.pool.slice();}
  const ps=cand.map(i=>({i,p:prio(cur.sec,gs[i]),r:Math.random()}));ps.sort((x,y)=>x.p[0]-y.p[0]||x.p[1]-y.p[1]||x.r-y.r);return ps[0].i;}
function show(){const {sec}=cur;app.replaceChildren();
  const top=el('div',{class:'top'},el('button',{class:'back',onclick:home},'← 分野選択'),el('span',{class:'count'},''));
  app.append(top);
  if(!cur.pool.length){app.append(el('div',{class:'empty'},mode==='miss'?'間違えた問題はありません。':mode==='seen'?'まだ解いた問題がありません。「すべて」で解くと、ここに出てくるようになります。':'問題がありません。'));return;}
  if(cur.current==null){cur.current=nextGroup();cur.shown.add(cur.current);}
  const g=groups(sec)[cur.current];
  top.lastChild.textContent=`${SEC[sec].name} ${cur.shown.size} / ${cur.total}${{miss:'（間違えた問題）',seen:'（解いた問題）'}[mode]||''}`;
  const sheet=el('div',{class:'sheet'});
  const order=sec==='non'?[0]:shuffle(g.items.map((_,i)=>i));const items=sec==='non'?[g.single]:order.map(i=>g.items[i]);
  if(sec==='non'){sheet.append(el('div',{class:'passage'},el('div',{class:'no'},`No.${g.no}`),el('div',{class:'ttl'},g.single.q),g.single.alt&&el('div',{class:'alt'},'別表記：'+g.single.alt)));}
  else sheet.append(el('div',{class:'passage'},el('div',{class:'no'},`大問 No.${g.no}`),el('div',{class:'ttl'},g.t),g.alt&&el('div',{class:'alt'},'別表記：'+g.alt)));
  let answered=0,correct=0;const foot=el('div',{class:'foot'});const reveals=[];
  items.forEach((it,pos)=>{const k=sec==='non'?key(sec,g):key(sec,g,it._i);
    const box=el('div',{class:'item'});
    if(sec!=='non'){const label=it.seq?'並び':it.n==null?'設問?':'設問'+it.n;
      box.append(el('div',{class:'qhead'},el('span',{class:'qnum'},label),el('span',{class:'qtext'},it.seq?'設問文なし：設問1→4の解答の並びは？':it.q)));
      if(it.qa)box.append(el('div',{class:'qalt'},'別表記：'+it.qa));}
    let chs,abc=false;
    if(sec==='gen'&&!it.seq){abc=true;chs=ABC.map(L=>({L,t:GEN_LBL[L],ok:it.acc.includes(L)}));}
    else{chs=sec==='gen'?seqChoices(it):sec==='eng'?engChoices(g,it):nonChoices(it);chs.forEach((c,j)=>c.L=ABC[j]);}
    const wrap=el('div',{class:'choices'+(abc?' abc':'')});const fb=el('div',{class:'fb',hidden:''});
    const btns=chs.map(c=>{const b=el('button',{class:'ch'},el('span',{class:'bub'},c.L),el('span',{class:'lbl'},c.t));b._c=c;return b;});
    let done=false;
    function finish(chosen){if(done)return;done=true;answered++;
      btns.forEach(b=>{b.disabled=true;if(b._c.ok)b.classList.add('right');});
      if(chosen){chosen.classList.add('pick');if(!chosen._c.ok)chosen.classList.add('wrong');}
      const ok=chosen&&chosen._c.ok;if(ok)correct++;
      if(chosen){if(ok){delete S.wrong[k];S.done[k]=1;}else{S.wrong[k]=1;}const v=S.cnt[k]||[0,0];S.cnt[k]=[v[0]+1,v[1]+(ok?1:0)];save();}
      fb.hidden=false;
      fb.append(el('div',{class:'verdict '+(ok?'ok':'ng')},chosen?(ok?'正解':'不正解'):'解答'),
        it.g?el('div',{class:'ans'},el('span',{class:'src gab'},'GAB解答集'),'の答え：',el('b',null,it.g)):el('div',{class:'ans'},el('span',{class:'src'},'最有力'),'の答え：',el('b',null,it.a),el('span',{class:'note'},'（GAB解答集に収録なし）')));
      if(it.galt)fb.append(el('div',{class:'note'},'GAB解答集内の別の記載：'+it.galt.join(' ／ ')));
      if(S.cnt[k])fb.append(el('div',{class:'note'},`この設問の成績：${S.cnt[k][0]}回中${S.cnt[k][1]}回正解（正答率${Math.round(S.cnt[k][1]/S.cnt[k][0]*100)}%）`));
      if(it.g?it.ot:it.cf)fb.append(el('div',{class:'note'},el('span',{class:'chip'},'答えが分かれています'),'他の解答集での答え：'+it.bd));
      if(it.m)fb.append(el('div',{class:'note'},'備考：'+it.m));
      if(answered===items.length)renderFoot();}
    btns.forEach(b=>b.addEventListener('click',()=>finish(b)));reveals.push(()=>finish(null));
    wrap.append(...btns);box.append(wrap,fb);sheet.append(box);});
  const next=()=>{cur.current=null;show();window.scrollTo(0,0);};
  function renderFoot(){foot.replaceChildren(el('div',{class:'score'},`${correct} / ${items.length} 正解`,el('small',null,correct===items.length?'全問正解':'間違えた設問は「間違えた問題」で復習できます')),
    el('div',{class:'acts'},el('button',{class:'btn ghost',onclick:()=>{show();window.scrollTo(0,0);}},'もう一度解く'),el('button',{class:'btn',id:'nextBtn',onclick:next},sec==='non'?'次の問題 →':'次の大問 →')));document.getElementById('nextBtn').focus({preventScroll:true});}
  foot.append(el('button',{class:'btn ghost',onclick:()=>reveals.forEach(f=>f())},'答えを表示'),el('button',{class:'link',onclick:next},'スキップ'));
  app.append(sheet,foot);}
home();
</script>
